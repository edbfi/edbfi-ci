# SPDX-License-Identifier: AGPL-3.0-only
# Copy as .github/workflows/ci.yml; adapt commands, directories and runners to the repo.
# Give each repo its own weekly minute. Every added PR job belongs in ci-ok. No paths: filter:
# a skipped workflow leaves the required checks pending.
name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "17 2 * * 0" }]   # weekly main revalidation; minute unique per repo
permissions: {}
# The head SHA keeps a re-run from cancelling a newer head; main runs never cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with: { extra-args: "--all-files --hook-stage manual" }
  casks:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bash scripts/check-casks.sh
  formulae:
    # No -latest ARM64 label exists: keep the arm label on ubuntu-latest's generation.
    strategy: { fail-fast: false, matrix: { runner: [ubuntu-latest, ubuntu-24.04-arm] } }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - run: bash scripts/check-formulae.sh
  ci-ok:
    if: always()
    needs: [checks, casks, formulae]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
        run: |
          jq -e --arg skips "$ALLOWED_SKIPS" '
            ($skips | split(",") | map(select(. != ""))) as $allowed
            | length > 0 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and (.key | IN($allowed[]))))
          ' <<<"$NEEDS" >/dev/null || { echo "::error::ci-ok failed: $(jq -c 'map_values(.result)' <<<"$NEEDS")"; exit 1; }
