triggers:
  - id: bun-v2
    kind: merged_pr
    repo: dependabot/dependabot-core
    number: 16071
    action: Pilot Bun lockfile v2 updates, restore the commented Bun blocks after a successful pilot, and pilot biome-migrate.yml (design/dependabot.md and design/biome.md).
  - id: biome-const
    kind: npm_release
    package: '@biomejs/biome'
    above: 2.5.14
    action: Check the seven {@const} repos go green, then re-check docrewind's formatter overrides (B4 in DECISIONS.md).
  - id: actionlint-queue
    kind: github_release
    repo: rhysd/actionlint
    above: 1.7.12
    action: Test queue and ubuntu-26.04-arm support and remove the allowances that are no longer needed (design/prek.md).
  - id: prek-toml
    kind: merged_pr
    repo: dependabot/dependabot-core
    number: 15271
    action: Informational — review Dependabot's prek.toml support; the current YAML configuration remains supported.
  - id: replex-green
    kind: manual
    action: Move replex to the normal auto-merge path after manually verifying its CI is green and enforced (design/auto-merge.md).
  - id: openapi-typescript-peers
    kind: npm_release
    package: openapi-typescript
    above: 7.13.0
    action: Recheck TypeScript peer compatibility in zondarr/frontend before enabling check-peers there (B6 in DECISIONS.md).
  - id: superforms-3-stable
    kind: npm_release
    package: sveltekit-superforms
    above: 2.999.999
    action: Pin the staged SvelteKit 3 PRs in obzorarr and setun to the stable sveltekit-superforms 3 release, drop any prerelease pin allowance and rerun their gates (D18 in DECISIONS.md).
  - id: kit-3-poyo-studio
    kind: merged_pr
    repo: edbfi/poyo-studio
    number: 82
    action: Drop poyo-studio from B5 in DECISIONS.md and STATE.md, deleting B5 once no repo remains, and update its design/repos.md rows for SvelteKit 3 (D18 in DECISIONS.md).
  - id: kit-3-otpravkarr
    kind: merged_pr
    repo: edbfi/otpravkarr
    number: 146
    action: Drop otpravkarr from B5 in DECISIONS.md and STATE.md, deleting B5 once no repo remains, and update its design/repos.md rows for SvelteKit 3 (D18 in DECISIONS.md).
  - id: kit-3-obzorarr
    kind: merged_pr
    repo: edbfi/obzorarr
    number: 225
    action: Drop obzorarr from B5 in DECISIONS.md and STATE.md, deleting B5 once no repo remains, and update its design/repos.md rows for SvelteKit 3 (D18 in DECISIONS.md).
  - id: kit-3-zondarr
    kind: merged_pr
    repo: edbfi/zondarr
    number: 264
    action: Drop zondarr from B5 in DECISIONS.md and STATE.md (B6 stays), deleting B5 once no repo remains, and update its design/repos.md rows for SvelteKit 3 (D18 in DECISIONS.md).
  - id: kit-3-setun
    kind: merged_pr
    repo: edbfi/setun
    number: 99
    action: Update setun's design/repos.md rows for SvelteKit 3 and the official Bun adapter (D18 in DECISIONS.md).
  - id: kit-runtime-origin
    kind: manual
    action: Once SvelteKit ships a runtime origin setting (sveltejs/kit#17328), replace the app-owned origin fronts in obzorarr, otpravkarr, poyo-studio, setun and zondarr/frontend with it.
