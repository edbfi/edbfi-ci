# SPDX-License-Identifier: AGPL-3.0-only
triggers:
  - id: bun-v2
    kind: merged_pr
    repo: dependabot/dependabot-core
    number: 16071
    action: Pilot Bun lockfile v2 updates, restore the commented Bun blocks after a successful pilot, and pilot biome-migrate.yml (design/dependabot.md and design/biome.md).
  - id: actionlint-queue
    kind: github_release
    repo: rhysd/actionlint
    above: 1.7.12
    action: Test queue and ubuntu-26.04-arm support and remove the allowances that are no longer needed (design/prek.md).
  - id: ubuntu-latest-26
    kind: manual
    action: When the runner-images README maps `ubuntu-latest` to Ubuntu 26.04, move every `ubuntu-24.04-arm` label to `ubuntu-26.04-arm` in one PR per repo (design/ci.md ci-A2).
  - id: replex-green
    kind: manual
    action: Move replex to the normal auto-merge path after manually verifying its CI is green and enforced (design/auto-merge.md).
  - id: qbittorrent-standard-dmg
    kind: manual
    action: Once the latest stable qBittorrent release has its standard `qbittorrent-X.Y.Z.dmg`, check that the homebrew-taps updater published it and pushed the cask (design/d8.md rule 9).
  - id: homebrew-push-admin-only
    kind: manual
    action: After the next homebrew-taps update-casks push, check its rule suite shows `bypass` and push CI ran (design/settings.md rule 4.2, D16); if it was rejected, investigate before changing the ruleset, since a `DeployKey` bypass actor would need D16 and settings.md rule 4.2 changed first. Then delete the STATE.md open item.
  - id: icarus-bevy-cargo
    kind: manual
    action: Once icarus-bevy has a Cargo project, move it to the Native tier in a PR that adds rust-toolchain.toml, a committed Cargo.lock, a Linux build job, cargo Dependabot and a cargo audit entry (design/repos.md).
  - id: braces-fix
    kind: npm_release
    package: braces
    above: 3.0.3
    action: Take the fixed braces (GHSA-vfj7-8cjw-p6xm) in docrewind with bun audit fix (design/dependabot.md rule 8) so its audit turns green.
  - id: node-forge-fix
    kind: npm_release
    package: node-forge
    above: 1.4.0
    action: Take the fixed node-forge (GHSA-86w9-cpqp-85rv) in docrewind with bun audit fix or bun update web-ext (design/dependabot.md rule 8) so its audit turns green.
  - id: fx-runner-shell-quote
    kind: npm_release
    package: fx-runner
    above: 1.6.0
    action: If fx-runner now allows shell-quote 1.11.0 or later, drop docrewind's shell-quote override (package.json overrides) in a dependency PR.
  - id: openapi-typescript-peers
    kind: npm_release
    package: openapi-typescript
    above: 7.13.0
    action: Recheck TypeScript peer compatibility in zondarr/frontend before enabling check-peers there (B6 in DECISIONS.md).
  - id: kit-runtime-origin
    kind: manual
    action: Once SvelteKit ships a runtime origin setting (sveltejs/kit#17328), replace the app-owned origin fronts in obzorarr, otpravkarr, poyo-studio, setun and zondarr/frontend with it.
  - id: kit-malformed-path-redirect
    kind: merged_pr
    repo: sveltejs/kit
    number: 17194
    action: This fixes sveltejs/kit#17193 (a redirect() thrown in handle escapes server.respond() for an undecodable path). Wait for the first stable @sveltejs/kit release that contains the merge, then take it in otpravkarr, setun, zondarr/frontend, obzorarr and poyo-studio with the monthly manual Bun update (design/dependabot.md rule 8). Add a regression test that fails on 3.0.0 to each affected app (the otpravkarr and setun setup gates, the zondarr/frontend /login and /setup redirects) showing that document and __data.json requests for /%, /%zz, /%C3 and /%E0%A4%A get the app's redirect, the server stays healthy and the process exits 0 after SIGTERM, with /%25zz and /%C3%A6 as valid controls.
  - id: playwright-route-times
    kind: npm_release
    package: playwright
    above: 1.63.999
    action: Playwright 1.64 carries the Chromium fix for microsoft/playwright#41802 (a request sent while a one-shot route with times 1 expires is never continued). Once poyo-studio pins it (monthly manual Bun update, design/dependabot.md rule 8), remove the standing route.fallback() routes for JOB-17 (edbfi/poyo-studio#84) and E2E-01..15 (edbfi/poyo-studio#87) from tests/e2e/studio-flows.browser.ts and confirm the studio-flows tests pass in repeated runs without them.
  - id: hotio-manifest-retry-cleanup
    kind: merged_pr
    repo: hotio/base
    number: 30
    action: Delete the edbfi/base-image branch fix/manifest-retry-cleanup (the head of hotio/base#30); the next sync-hotio.yml run mirrors the merged fix.
  - id: obzorarr-kit3-release
    kind: github_release
    repo: edbfi/obzorarr
    above: 0.1.11
    action: Inspect the latest release's tag and source. Once a plain X.Y.Z release contains SvelteKit 3, use a workflows PR into obzorarr-docker's release branch (design/repos.md rule 8) to remove the obsolete scripts/serve.ts* copies and the bun start entry, checking the remaining differences against nightly. Keep the issue open until that release exists.
