# SPDX-License-Identifier: AGPL-3.0-only
triggers:
  - id: actionlint-queue
    kind: github_release
    repo: rhysd/actionlint
    above: 1.7.12
    action: Test queue and ubuntu-26.04-arm support and remove the allowances that are no longer needed (design/prek.md).
  - id: ubuntu-latest-26
    kind: manual
    action: When the runner-images README maps `ubuntu-latest` to Ubuntu 26.04, move every `ubuntu-24.04-arm` label to `ubuntu-26.04-arm` in one PR per repo (design/ci.md ci-A2).
  - id: qbittorrent-standard-dmg
    kind: manual
    action: Once the latest stable qBittorrent release has its standard `qbittorrent-X.Y.Z.dmg`, check that the homebrew-taps updater published it and pushed the cask (design/d8.md rule 9).
  - id: icarus-bevy-cargo
    kind: manual
    action: Once icarus-bevy has a Cargo project, move it to the Native tier in a PR that adds rust-toolchain.toml, a committed Cargo.lock, a Linux build job, cargo Dependabot and a cargo audit entry (design/repos.md).
  - id: dependabot-schedule
    kind: manual
    action: After Dependabot's run on Monday 2026-10-13, check that its scheduled `github-actions` runs opened the pending bumps (`upload-artifact` 7.0.2, `setup-uv` 10.3.0) in repos that still lack them; then close dependabot-A1 in design/dependabot.md, or inspect each repo's Dependabot tab if none appeared.
  - id: rewrite-stack-tier
    kind: manual
    action: Once comradarr or zimuarr has an application on main, move it from its tooling-only row to its stack tier (design/repos.md rule 12) with its CI jobs, smoke, Dependabot and audit entries.
  - id: kit-runtime-origin
    kind: manual
    action: Once SvelteKit ships a runtime origin setting (sveltejs/kit#17328), replace the app-owned origin fronts in poyo-studio and setun with it.
  - id: kit-malformed-path-redirect
    kind: merged_pr
    repo: sveltejs/kit
    number: 17194
    action: This fixes sveltejs/kit#17193 (a redirect() thrown in handle escapes server.respond() for an undecodable path). Wait for the first stable @sveltejs/kit release that contains the merge, then check that Dependabot's bun PRs took it into setun and poyo-studio. Add a regression test that fails on 3.0.0 to the setun setup gate showing that document and __data.json requests for /%, /%zz, /%C3 and /%E0%A4%A get the app's redirect, the server stays healthy and the process exits 0 after SIGTERM, with /%25zz and /%C3%A6 as valid controls.
  - id: hotio-manifest-retry-cleanup
    kind: merged_pr
    repo: hotio/base
    number: 30
    action: Delete the edbfi/base-image branch fix/manifest-retry-cleanup (the head of hotio/base#30); the next sync-hotio.yml run mirrors the merged fix.
  - id: obzorarr-kit3-release
    kind: github_release
    repo: edbfi/obzorarr
    above: 0.1.11
    action: Inspect the latest release's tag and source. Once a plain X.Y.Z release contains SvelteKit 3, use a workflows PR into obzorarr-docker's release branch (design/repos.md rule 8) to remove the obsolete scripts/serve.ts* copies and the bun start entry, checking the remaining differences against nightly. Keep the issue open until that release exists.
  - id: bun-jsdom-vm
    kind: manual
    action: Once a Bun release fixes oven-sh/bun#45102, check that Vitest's jsdom environment passes on the latest jsdom under `bunx --bun vitest run`, then drop the jsdom 30.0.x cap from design/ci.md rule 8 and let docrewind take the bump.
  - id: bun-lifecycle-shim
    kind: manual
    action: Once `bun ci` applies the `--bun` node shim to lifecycle scripts (oven-sh/bun#44584), drop the lifecycle-script clause from design/ci.md rule 8.
