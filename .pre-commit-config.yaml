# CI runs the manual stage: prek run --all-files --hook-stage manual (design/prek.md).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Local only: it scans --staged, so it finds nothing under --all-files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
      - id: actionlint
        alias: actionlint-templates
        name: Lint workflow templates
        entry: python3 tools/lint_templates.py actionlint
        files: ^templates/(ci-.*|pr-policy|dependabot-auto-merge|biome-migrate|pullfrog)\.yml$
        types: [file]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
      - id: zizmor
        alias: zizmor-templates
        name: Audit workflow and Dependabot templates
        entry: python3 tools/lint_templates.py zizmor
        args: []
        files: ^templates/.*\.yml$
        types: [file]

  - repo: local
    hooks:
      - id: uv-lock
        name: Check Python lock freshness
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: basedpyright-config
        name: Guard basedpyright configuration
        entry: python3 tools/check_basedpyright_config.py
        language: python
        language_version: "3.14"
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: Type-check all Python
        entry: uvx basedpyright@latest
        language: system
        pass_filenames: false
        always_run: true
      - id: privileged-jobs
        name: Check privileged workflow jobs
        entry: python3 hooks/edbfi_hooks/privileged_jobs.py
        language: python
        language_version: "3.14"
        additional_dependencies: [PyYAML]
        files: ^(\.github/workflows/[^/]+|templates/(ci-.*|pr-policy|dependabot-auto-merge|biome-migrate|pullfrog))\.ya?ml$
      - id: validate-hook-templates
        name: Validate hook templates
        entry: prek validate-config
        language: system
        files: ^templates/pre-commit\..*\.yaml$
      - id: privileged-jobs-tests
        name: privileged-jobs tests
        entry: python3 -m unittest discover -s hooks -p test_*.py
        language: python
        language_version: "3.14"
        additional_dependencies: [PyYAML]
        pass_filenames: false
        files: ^(hooks/|design/|templates/|pyproject\.toml|\.pre-commit-hooks\.yaml)
      - id: check-peers-tests
        name: check-peers tests
        entry: bun test hooks/check-peers.test.ts
        language: system
        pass_filenames: false
        files: ^(hooks/|package\.json|\.pre-commit-hooks\.yaml)
      - id: doc-guard
        name: doc-guard
        entry: python3 tools/doc_guard/doc_guard.py
        language: python
        language_version: "3.14"
        pass_filenames: false
        always_run: true
      - id: tooling-tests
        name: tooling guard tests
        entry: python3 -m unittest discover -s tools -t .
        language: python
        language_version: "3.14"
        additional_dependencies: [PyYAML]
        pass_filenames: false
        files: ^(tools/|templates/|watch\.yml|\.github/workflows/watch\.yml|pyproject\.toml)
