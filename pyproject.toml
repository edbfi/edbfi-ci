# SPDX-License-Identifier: AGPL-3.0-only
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edbfi-ci-hooks"
version = "0.1.0"
description = "Shared CI policy hooks for edbfi repositories"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = ["PyYAML>=6.0.3"]

[project.scripts]
privileged-jobs = "edbfi_hooks.privileged_jobs:main"

[tool.setuptools.packages.find]
where = ["hooks"]
include = ["edbfi_hooks"]
